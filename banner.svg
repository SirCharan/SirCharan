<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Charandeep Kapoor — trading systems and local-first AI tooling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0C0E"/>
      <stop offset="100%" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 75H1280M0 150H1280M0 225H1280"/>
    <path d="M160 0V300M320 0V300M480 0V300M640 0V300M800 0V300M960 0V300M1120 0V300"/>
  </g>

  <!-- equity curve -->
  <path d="M0 250 L90 238 L170 246 L250 214 L330 224 L410 188 L490 200 L570 160 L650 172 L730 132 L810 146 L890 104 L970 118 L1050 78 L1130 92 L1210 54 L1280 62 L1280 300 L0 300 Z" fill="url(#fill)"/>
  <path d="M0 250 L90 238 L170 246 L250 214 L330 224 L410 188 L490 200 L570 160 L650 172 L730 132 L810 146 L890 104 L970 118 L1050 78 L1130 92 L1210 54 L1280 62"
        fill="none" stroke="url(#curve)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1210" cy="54" r="4.5" fill="#FFB020"/>
  <circle cx="1210" cy="54" r="10" fill="none" stroke="#FFB020" stroke-opacity="0.35" stroke-width="1.5"/>

  <g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace">
    <text x="64" y="104" fill="#F2F3F5" font-size="46" font-weight="700" letter-spacing="-1">Charandeep Kapoor</text>
    <text x="64" y="142" fill="#FFB020" font-size="17" letter-spacing="2.4">PRODUCT · DELTA EXCHANGE</text>
    <text x="64" y="182" fill="#9AA0A8" font-size="17">Trading systems for crypto and Indian markets.</text>
    <text x="64" y="208" fill="#9AA0A8" font-size="17">Local-first tooling for AI coding agents.</text>
    <text x="64" y="252" fill="#5C626B" font-size="14" letter-spacing="1.2">IIT KANPUR</text>
  </g>
</svg>
